services:

  # ── Databases ──────────────────────────────────────────────

  product-mongodb:
    image: mongo:7.0.5
    container_name: product-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USERNAME}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: product-service
    volumes:
      - mongodb-data:/data/db
    networks:
      - ecommerce
    restart: unless-stopped

  order-db:
    image: mysql:8.3.0
    container_name: order-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ORDER_PASSWORD}
      MYSQL_DATABASE: order_service
    volumes:
      - order-db-data:/var/lib/mysql
      - ./docker/mysql/order-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ecommerce
    restart: unless-stopped

  inventory-db:
    image: mysql:8.3.0
    container_name: inventory-db
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_INVENTORY_PASSWORD}
      MYSQL_DATABASE: inventory_service
    volumes:
      - inventory-db-data:/var/lib/mysql
      - ./docker/mysql/inventory-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - ecommerce
    restart: unless-stopped

  # ── Messaging ──────────────────────────────────────────────

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - ecommerce
    restart: unless-stopped

  broker:
    image: confluentinc/cp-kafka:7.5.0
    container_name: broker
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://broker:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - ecommerce
    restart: unless-stopped

  schema-registry:
    image: confluentinc/cp-schema-registry:7.5.0
    container_name: schema-registry
    depends_on:
      - broker
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_LISTENERS: http://schema-registry:8081
    networks:
      - ecommerce
    restart: unless-stopped

  # ── Security ───────────────────────────────────────────────

  keycloak-mysql:
    image: mysql:8
    container_name: keycloak-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${KEYCLOAK_DB_ROOT_PASSWORD}
      MYSQL_DATABASE: keycloak
      MYSQL_USER: keycloak
      MYSQL_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - keycloak-db-data:/var/lib/mysql
    networks:
      - ecommerce
    restart: unless-stopped

  keycloak:
    image: quay.io/keycloak/keycloak:24.0.1
    container_name: keycloak
    command: ["start-dev", "--import-realm"]
    environment:
      DB_VENDOR: MYSQL
      DB_ADDR: keycloak-mysql
      DB_DATABASE: keycloak
      DB_USER: keycloak
      DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
    volumes:
      - ./api-gateway/docker/keycloak/realms/:/opt/keycloak/data/import/
    depends_on:
      - keycloak-mysql
    networks:
      - ecommerce
    restart: unless-stopped

  # ── Observability ──────────────────────────────────────────

  loki:
    image: grafana/loki:main
    container_name: loki
    command: ['-config.file=/etc/loki/local-config.yaml']
    networks:
      - ecommerce
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.46.0
    container_name: prometheus
    command:
      - --enable-feature=exemplar-storage
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - ecommerce
    restart: unless-stopped

  tempo:
    image: grafana/tempo:2.2.2
    container_name: tempo
    command: ["-config.file=/etc/tempo.yaml"]
    volumes:
      - ./docker/tempo/tempo.yml:/etc/tempo.yaml:ro
      - tempo-data:/tmp/tempo
    networks:
      - ecommerce
    restart: unless-stopped

  grafana:
    image: grafana/grafana:10.1.0
    container_name: grafana
    volumes:
      - ./docker/grafana:/etc/grafana/provisioning/datasources:ro
      - grafana-data:/var/lib/grafana
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    networks:
      - ecommerce
    restart: unless-stopped

  # ── Application Services ───────────────────────────────────

  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    container_name: product-service
    environment:
      MONGODB_URI: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@product-mongodb:27017/product-service?authSource=admin
      ZIPKIN_ENDPOINT: http://tempo:9411/api/v2/spans
      LOKI_URL: http://loki:3100/loki/api/v1/push
      TRACING_SAMPLING: ${TRACING_SAMPLING}
    depends_on:
      - product-mongodb
      - loki
      - tempo
    networks:
      - ecommerce
    restart: unless-stopped

  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    container_name: order-service
    environment:
      DB_URL: jdbc:mysql://order-db:3306/order_service?createDatabaseIfNotExist=true
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_ORDER_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      INVENTORY_URL: http://inventory-service:8082
      ZIPKIN_ENDPOINT: http://tempo:9411/api/v2/spans
      LOKI_URL: http://loki:3100/loki/api/v1/push
      TRACING_SAMPLING: ${TRACING_SAMPLING}
    depends_on:
      - order-db
      - broker
      - schema-registry
      - loki
      - tempo
    networks:
      - ecommerce
    restart: unless-stopped

  inventory-service:
    build:
      context: ./inventory-service
      dockerfile: Dockerfile
    container_name: inventory-service
    environment:
      DB_URL: jdbc:mysql://inventory-db:3306/inventory_service
      DB_USERNAME: root
      DB_PASSWORD: ${MYSQL_INVENTORY_PASSWORD}
      ZIPKIN_ENDPOINT: http://tempo:9411/api/v2/spans
      LOKI_URL: http://loki:3100/loki/api/v1/push
      TRACING_SAMPLING: ${TRACING_SAMPLING}
    depends_on:
      - inventory-db
      - loki
      - tempo
    networks:
      - ecommerce
    restart: unless-stopped

  notification-service:
    build:
      context: ./notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    environment:
      KAFKA_BOOTSTRAP_SERVERS: broker:29092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      MAIL_HOST: ${MAIL_HOST}
      MAIL_PORT: ${MAIL_PORT}
      MAIL_USERNAME: ${MAIL_USERNAME}
      MAIL_PASSWORD: ${MAIL_PASSWORD}
      ZIPKIN_ENDPOINT: http://tempo:9411/api/v2/spans
      LOKI_URL: http://loki:3100/loki/api/v1/push
      TRACING_SAMPLING: ${TRACING_SAMPLING}
    depends_on:
      - broker
      - schema-registry
      - loki
      - tempo
    networks:
      - ecommerce
    restart: unless-stopped

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    environment:
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/ecommerce-realm
      PRODUCT_SERVICE_URL: http://product-service:8080
      ORDER_SERVICE_URL: http://order-service:8081
      INVENTORY_SERVICE_URL: http://inventory-service:8082
      ZIPKIN_ENDPOINT: http://tempo:9411/api/v2/spans
      LOKI_URL: http://loki:3100/loki/api/v1/push
      TRACING_SAMPLING: ${TRACING_SAMPLING}
    depends_on:
      - keycloak
      - product-service
      - order-service
      - inventory-service
      - loki
      - tempo
    networks:
      - ecommerce
    restart: unless-stopped

volumes:
  mongodb-data:
  order-db-data:
  inventory-db-data:
  keycloak-db-data:
  prometheus-data:
  tempo-data:
  grafana-data:

networks:
  ecommerce:
    driver: bridge
