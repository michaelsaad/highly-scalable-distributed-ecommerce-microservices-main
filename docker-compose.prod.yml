# Production overrides — no DB ports exposed, resource limits, production Keycloak
services:

  product-mongodb:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  order-db:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  inventory-db:
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  broker:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  keycloak:
    command: ["start", "--import-realm", "--hostname-strict=false"]
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  product-service:
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  order-service:
    ports:
      - "8081:8081"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  inventory-service:
    ports:
      - "8082:8082"
    environment:
      DB_URL: jdbc:mysql://inventory-db:3306/inventory_service
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  notification-service:
    deploy:
      resources:
        limits:
          memory: 384M
          cpus: "0.5"

  api-gateway:
    ports:
      - "9000:9000"
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  grafana:
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
    ports:
      - "3000:3000"

  prometheus:
    ports:
      - "9090:9090"

  tempo:
    ports:
      - "9411:9411"
